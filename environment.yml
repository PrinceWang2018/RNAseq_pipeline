name: rnaseq
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # STAR is pinned exactly: a STAR index must be used with a compatible STAR
  # version. 2.7.11b reads any index built with STAR >= 2.7.4a.
  - star=2.7.11b
  - trim-galore>=0.6.7
  - fastqc>=0.12
  - pigz
  - samtools>=1.17
  - subread>=2.0.3
  - multiqc>=1.19
